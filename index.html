<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Lidless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
</head>
<body>
  <main class="stage">
    <canvas id="game" width="960" height="540" aria-label="Lidless: a rainy street at night outside a radio repair shop."></canvas>
    <button id="view" class="view" type="button" aria-pressed="true" title="Switch view (E)"><span class="dot" aria-hidden="true"></span><span id="view-label">Concierge view</span></button>
    <p id="stats" class="stats" hidden></p>
    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
