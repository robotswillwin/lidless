<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <!-- added to a phone's home screen, it opens full screen, held sideways, with no browser around it -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lidless">
  <meta name="theme-color" content="#000000">
  <title>Lidless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Kalam:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,500&family=VT323&display=swap">
</head>
<body>
  <main class="stage">
    <canvas id="game" width="960" height="540" aria-label="Lidless: a rainy street at night outside a radio repair shop."></canvas>
    <p id="stats" class="stats" hidden></p>
    <div id="fade" class="fade on boot" aria-hidden="true">
      <p class="fade-title">Lidless</p>
      <!-- the wait: the privacy sign's closed eye, which opens (src/game/eye.ts) -->
      <svg class="fade-wait" viewBox="-60 -44 120 88">
        <defs>
          <clipPath id="eye-opening"><path class="opening" d="M-34 0Q0 30 34 0Q0 30 -34 0Z"/></clipPath>
          <radialGradient id="eye-ball"><stop offset="0" stop-color="#1c1622"/><stop offset="1" stop-color="#060509"/></radialGradient>
          <radialGradient id="eye-glow"><stop offset="0" stop-color="#ff2b3d" stop-opacity=".9"/><stop offset=".4" stop-color="#ff2b3d" stop-opacity=".3"/><stop offset="1" stop-color="#ff2b3d" stop-opacity="0"/></radialGradient>
        </defs>
        <circle class="ring" r="38"/>
        <g transform="translate(0 -5)">
          <!-- the lashes behind the eye: opening, what hangs over it hides behind it -->
          <path class="lashes" d="M-22.44 8.47L-26.25 16.62M-11.22 13.37L-13.17 22.15M0 15L0 24M11.22 13.37L13.17 22.15M22.44 8.47L26.25 16.62"/>
          <g clip-path="url(#eye-opening)">
            <rect x="-34" y="-15" width="68" height="30" fill="url(#eye-ball)"/>
            <g class="look">
              <circle class="glow" r="18" fill="url(#eye-glow)" opacity="0"/>
              <circle class="iris" r="10" opacity="0"/>
              <circle class="pupil" r="0"/>
              <circle class="glint" cx="-2" cy="-2.2" r="1.3" opacity="0"/>
            </g>
          </g>
          <path class="lid" d="M-34 0Q0 30 34 0"/>
          <path class="lid upper" d="M-34 0Q0 30 34 0"/>
        </g>
      </svg>
    </div>
    <p id="error" class="error" hidden></p>
    <div id="turn" class="turn" role="dialog" aria-label="Turn your phone sideways">
      <svg class="turn-phone" viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="10" width="20" height="36" rx="3"/><path d="M14 50 a 22 22 0 0 0 36 0"/><path d="M46 46 l 4 4 l -6 1"/></svg>
      <p>Turn your phone sideways</p>
      <button type="button" class="turn-anyway">Play upright anyway</button>
    </div>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
