<title>Concierge Pixel Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,600&family=Yellowtail&display=swap">
<style>
/* Layout: one living pixel frame up top, then how it is made. */
:root {
  --bg: #07070b;
  --fg: #e9e6ef;
  --muted: #918ca3;
  --rule: #211f2b;
  --amber: #f0b25a;
  --neon: #ff7cbe;
  --cyan: #8ff0ea;
  --frame-bg: #000;
  --pill: rgba(8, 8, 14, 0.78);
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --ui: "Jost", "Futura", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Jost", "Futura", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 36px); padding-block: clamp(28px, 5vw, 64px) 88px; display: grid; gap: clamp(28px, 4vw, 48px); }
.intro { display: grid; gap: 12px; max-width: 760px; }
.eyebrow { margin: 0; font: 500 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--amber); }
h1 { margin: 0; font: 700 clamp(36px, 6vw, 68px)/1.05 var(--display); letter-spacing: .005em; text-wrap: balance; }
h1 .a, h1 .n { color: var(--amber); font-style: italic; font-weight: 600; }
.lede { margin: 0; max-width: 62ch; font-size: clamp(16px, 1.5vw, 19px); }
.frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; background: var(--frame-bg); box-shadow: 0 0 0 1px var(--rule), 0 40px 90px -40px rgba(0, 0, 0, .9); }
.frame canvas { display: block; width: 100%; height: 100%; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); }
.toggle { position: absolute; right: 2cqw; bottom: 2.2cqw; display: inline-flex; align-items: center; gap: .9cqw; padding: .8cqw 1.3cqw; border: 0; border-radius: 4px; background: var(--pill); color: var(--cyan); font: 400 clamp(10px, 1.15cqw, 15px)/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 0 1px rgba(143, 240, 234, .55), 0 0 22px rgba(143, 240, 234, .2); }
.toggle .dot { width: clamp(8px, 1cqw, 12px); aspect-ratio: 1; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.toggle[aria-pressed="false"] { color: var(--amber); box-shadow: 0 0 0 1px rgba(240, 178, 90, .55), 0 0 22px rgba(240, 178, 90, .18); }
.toggle[aria-pressed="false"] .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 48px; }
.notes h2 { margin: 0 0 6px; font: 700 21px/1.25 var(--display); letter-spacing: .005em; }
.notes p { margin: 0; color: var(--fg); }
.notes .hint { color: var(--muted); font-size: 15px; margin-top: 8px; }
.ramps { display: grid; gap: 6px; margin-top: 10px; }
.ramp { display: flex; height: 14px; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px var(--rule); }
.ramp i { flex: 1; }
.ramp-label { font: 400 12px/1.4 var(--mono); color: var(--muted); }
@media (max-width: 860px) { .notes { grid-template-columns: minmax(0, 1fr); } }
.solo .wrap { max-width: none; padding: 0; gap: 0; }
.solo .intro, .solo .notes { display: none; }
.solo .frame { box-shadow: none; }
</style>
