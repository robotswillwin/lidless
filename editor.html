<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Lidless scene editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
</head>
<body class="editor">
  <header class="ed-bar">
    <label class="ed-scene">Scene <select id="scene"></select></label>
    <button id="new-scene" type="button" title="A new scene from a built background">New scene</button>
    <span class="ed-sep"></span>
    <div class="ed-tasks" role="group" aria-label="What you are working on">
      <button type="button" data-task="all" aria-pressed="true" title="Everything (1)">All</button>
      <button type="button" data-task="layout" aria-pressed="false" title="Layout (2): the walk line, the reflection line and the ground, inside and outside areas, layers, the camera, the people's size">Layout</button>
      <button type="button" data-task="interaction" aria-pressed="false" title="Interaction (3): hotspots and exits, their texts and conversations, places to arrive at">Interaction</button>
      <button type="button" data-task="lighting" aria-pressed="false" title="Lighting (4): lights and their kinds, the scene's light">Lighting</button>
      <button type="button" data-task="effects" aria-pressed="false" title="Effects (5): steam and smoke, light shafts, beacons, drips, movers">Effects</button>
    </div>
    <span class="ed-sep"></span>
    <div class="ed-modes" role="group" aria-label="Which views your edits go to">
      <button type="button" data-mode="both" aria-pressed="true" title="Both: what you change becomes the same in both views. E shows the other view">Both</button>
      <button type="button" data-mode="raw" aria-pressed="false" title="Raw: see raw view, and what you change is raw view's own (E: AR)">Raw</button>
      <button type="button" data-mode="concierge" aria-pressed="false" title="AR: see the Concierge's view, and what you change is its own (E: raw)">AR</button>
    </div>
    <span id="showing" class="ed-showing" aria-live="polite"></span>
    <select id="variant" class="ed-variant" title="The scene in other conditions: rain, fog, a power cut. Its look panel's This scene edits the variant shown">
      <option value="">As it is</option>
    </select>
    <button id="look" type="button" title="The look panel (L)">Look</button>
    <button id="lighting" data-in="lighting" type="button" aria-pressed="false" title="Lights only (G): everything a flat grey, so only what the lights do shows">Lights only</button>
    <span class="ed-grow"></span>
    <span id="status" class="ed-status"></span>
    <button id="undo" type="button" title="Undo (Cmd+Z)" disabled>Undo</button>
    <button id="redo" type="button" title="Redo (Shift+Cmd+Z)" disabled>Redo</button>
    <button id="revert" type="button" title="Back to the scene as last saved (Cmd+Z brings back what you had)" disabled>Revert</button>
    <a id="play" class="ed-play" target="_blank" rel="noopener" title="Play from this scene in a new tab">Play</a>
    <button id="save" class="ed-save" type="button" title="Save the scene file (Cmd+S)">Save</button>
  </header>
  <nav class="ed-tools" aria-label="Add to the scene">
    <select id="add-light" class="ed-add" data-in="lighting" title="Add a light in the middle of the view: one of its own, or one of a kind (a preset)">
      <option value="">+ Light</option>
      <option value="light">A light of its own</option>
    </select>
    <button data-add="hotspot" data-in="interaction" type="button">+ Hotspot</button>
    <button data-add="exit" data-in="interaction" type="button" title="A hotspot that leads to another scene">+ Exit</button>
    <button data-add="spawn" data-in="interaction" type="button" title="A place to arrive at">+ Spawn</button>
    <button data-add="zone" data-in="layout" type="button" title="An area of the other kind: inside in a street, outside in a room">+ Area</button>
    <button data-add="layer" data-in="layout" type="button" title="Another built asset in the scene">+ Layer</button>
    <select id="add-effect" class="ed-add" data-in="effects" title="Add an effect in the middle of the view">
      <option value="">+ Effect</option>
      <option value="steam">Steam</option>
      <option value="smoke">Smoke</option>
      <option value="godray">Light shaft</option>
      <option value="beacon">Beacon</option>
      <option value="drips">Drips</option>
      <option value="mover">Mover (a train, a car…)</option>
      <option value="scope">Oscilloscope (live)</option>
      <option value="clock">Clock (live)</option>
      <option value="cradle">Newton’s cradle (live)</option>
      <option value="rings">Hologram rings (live)</option>
    </select>
    <span class="ed-sep"></span>
    <button id="paste" type="button" disabled>Paste</button>
    <span class="ed-grow"></span>
    <span class="ed-tools-hint" id="tools-hint"></span>
  </nav>
  <main class="ed-main">
    <div class="ed-stage" id="stage">
      <div class="ed-frame" id="frame">
        <canvas id="game" width="960" height="540" aria-label="The scene, rendered as in the game"></canvas>
        <svg id="overlay" class="ed-overlay" viewBox="0 0 960 540" aria-label="Lights, hotspots and places in the scene"></svg>
      </div>
      <input id="scroll" class="ed-scroll" type="range" min="0" max="0" value="0" aria-label="Scroll the scene" hidden>
      <p class="ed-help">Click to select, drag to move; drag a corner to resize. Delete removes; Cmd+C and Cmd+V copy and paste, here or into another scene, Cmd+D duplicates. 1 to 5 what you work on, E the other view, L look, G lights only, Cmd+Z undo, Shift+Cmd+Z redo, Cmd+S save.</p>
    </div>
    <aside class="ed-side" id="side" aria-label="Selected item"></aside>
  </main>
  <p id="error" class="error" hidden></p>
  <script type="module" src="./src/editor/main.ts"></script>
</body>
</html>
